port 26379
# Monitor by static IP (see docker-compose.yml). Using a hostname breaks failover:
# a stopped container's DNS name disappears, the lookups stall sentinel and it enters TILT mode.
sentinel monitor mymaster 10.77.0.10 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
